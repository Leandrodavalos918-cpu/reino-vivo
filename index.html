<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reino Vivo v0.5</title>
<style>
body{margin:0;background:#0d1117;color:#eef2f7;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:#171d26;border:1px solid #303947;border-radius:16px;padding:16px;margin:10px 0}
.big{font-size:34px;font-weight:800}.muted{color:#9da8b8}button{background:#263142;color:white;border:1px solid #435066;border-radius:11px;padding:10px 13px;margin:3px;font-weight:700}
.pill{display:inline-block;background:#243044;border-radius:18px;padding:4px 8px;margin:3px;font-size:12px}
</style></head><body><main>
<h1>🌍 Reino Vivo</h1><div class="muted">Universo autónomo · v0.5</div>
<div class="card"><div class="muted">Tiempo del mundo</div><div id="time" class="big">Cargando...</div><div id="state"></div>
<button onclick="advance(1)">+1 día</button><button onclick="advance(7)">+1 semana</button><button onclick="advance(30)">+1 mes</button><button onclick="advance(365)">+1 año</button>
<button onclick="togglePause()" id="pause">Pausa</button></div>
<div class="grid"><div class="card"><div class="muted">Población viva</div><div id="pop" class="big">-</div></div>
<div class="card"><div class="muted">Nobles vivos</div><div id="nobles" class="big">-</div></div>
<div class="card"><div class="muted">Parejas registradas</div><div id="families" class="big">-</div></div></div>
<h2>👑 Reinos</h2><div id="kingdoms" class="grid"></div>
<h2>🏛️ Política</h2><div id="politics" class="grid"></div><h2>⚖️ Cargos de poder</h2><div id="offices" class="grid"></div>
<h2>👥 Habitantes</h2><div id="people" class="grid"></div>
<h2>📰 Crónica reciente</h2><div id="events"></div>
</main><script>
let paused=false;
async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});return r.json()}
async function load(){let d=await api('/api/world');paused=!!d.world.paused;
document.querySelector('#time').textContent=`Año ${d.world.year}, día ${d.world.day}`;
document.querySelector('#state').textContent=paused?'⏸️ Mundo pausado':'▶️ Mundo activo';
document.querySelector('#pause').textContent=paused?'Reanudar':'Pausa';
document.querySelector('#pop').textContent=d.population.toLocaleString('es-PY');
document.querySelector('#nobles').textContent=d.nobles;
document.querySelector('#families').textContent=d.families;
document.querySelector('#kingdoms').innerHTML=d.kingdoms.map(k=>`<div class="card"><h3>👑 ${k.name}</h3><p>${k.ruler_title}: <b>${k.ruler}</b></p><p>💰 ${k.gold.toLocaleString('es-PY')} oro</p><p>Estabilidad: ${k.stability}%</p></div>`).join('');
document.querySelector('#politics').innerHTML=d.parties.map(p=>`<div class="card"><h3>🏛️ ${p.name}</h3><p>${p.kingdom}</p><p>Corriente: ${p.ideology}</p><p>Influencia: <b>${p.influence}</b> · Apoyo: <b>${p.support}%</b></p></div>`).join('');
document.querySelector('#offices').innerHTML=d.offices.map(o=>`<div class="card"><h3>⚖️ ${o.title}</h3><p>${o.person_name} · ${o.kingdom}</p><p>Poder del cargo: ${o.power}</p></div>`).join('');
document.querySelector('#people').innerHTML=d.people.map(p=>`<div class="card"><h3>${p.name}</h3><p>${p.age} años · ${p.job}</p><p>💰 ${p.wealth} oro · ${p.status}</p><span class="pill">🎯 ${p.goal}</span><span class="pill">⭐ ${p.reputation}</span><p class="muted">Familia: ${p.mother_id||p.father_id||p.partner_id?'sí':'sin vínculos registrados'}</p></div>`).join('');
document.querySelector('#events').innerHTML=d.events.map(e=>`<div class="card"><b>${e.title}</b><div class="muted">Día ${e.world_day}</div><p>${e.description}</p></div>`).join('')}
async function advance(days){if(paused)return;await api('/api/advance',{method:'POST',body:JSON.stringify({days})});load()}
async function togglePause(){paused=!paused;await api('/api/pause',{method:'POST',body:JSON.stringify({paused})});load()}
load();setInterval(load,15000)
</script></body></html>
